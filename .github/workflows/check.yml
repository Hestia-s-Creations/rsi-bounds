name: check
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the older run. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Named `fast` so it can be the repository's required status check.
  fast:
    timeout-minutes: 30
    # GitHub-hosted: free for a public repository, and outside pull requests never run on our own machine.
    # The org's self-hosted runner group does not accept public repositories.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Numerical checks
        run: |
          python3 -m pip install --quiet numpy scipy
          python3 checks/check_bounds.py | tee /tmp/check_bounds.out
          grep -q "ALL CHECKS PASS" /tmp/check_bounds.out
      - name: Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean build (no sorry)
        working-directory: lean
        run: |
          ! grep -n "sorry" SensorExperiment.lean
          lake exe cache get
          lake build
      - name: Lean axioms are the standard three
        working-directory: lean
        run: |
          lake env lean Axioms.lean | tee /tmp/axioms.out
          test "$(grep -c "depends on axioms" /tmp/axioms.out)" -eq 20
          ! grep "depends on axioms" /tmp/axioms.out | grep -v "\[propext, Classical.choice, Quot.sound\]"
